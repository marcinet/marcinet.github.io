<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dezimal-Explorer für Kinder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            touch-action: manipulation;
        }
        
        /* Mobile-optimized slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 44px; /* Larger touch target */
            width: 44px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -14px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 4px solid white;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 16px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 8px;
        }

        /* Base Scale: 1 Whole = 160px for better mobile fit */
        .whole-frame { 
            width: 160px; 
            height: 160px; 
            position: relative;
            background-color: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .block-unit { 
            width: 160px; 
            height: 160px; 
            background-color: #6366f1;
            border: 2px solid #4338ca;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 2.5rem;
        }

        .block-tenth { 
            width: 16px; 
            height: 160px; 
            background-color: #60a5fa;
            border-right: 1px solid #2563eb;
        }

        .block-hundredth { 
            width: 16px; 
            height: 16px; 
            background-color: #34d399;
            border-top: 1px solid #059669;
        }

        .block-thousandth { 
            width: 16px; 
            height: 1.6px; 
            background-color: #fbbf24;
            border-top: 1px solid #d97706;
        }

        .block-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Prevent text selection while sliding */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        
        const Box = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>;
        const Grid3X3 = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>;
        const Scale = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h18"/></svg>;

        const TabButton = ({ active, onClick, icon, label }) => (
            <button 
                onClick={onClick}
                className={`flex flex-1 items-center justify-center gap-2 px-3 py-3 rounded-xl font-bold transition-all text-sm ${active ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200'}`}
            >
                {icon}
                <span className="hidden sm:inline">{label}</span>
                <span className="sm:hidden">{label.substring(0, 5)}</span>
            </button>
        );

        const App = () => {
            const [value, setValue] = useState(0.500);
            const [activeTab, setActiveTab] = useState('visualizer');
            const [region, setRegion] = useState('CH'); 

            const parts = useMemo(() => {
                const valStr = value.toFixed(3);
                const [whole, decimals] = valStr.split('.');
                return {
                    whole: parseInt(whole),
                    tenths: parseInt(decimals[0]),
                    hundredths: parseInt(decimals[1]),
                    thousandths: parseInt(decimals[2])
                };
            }, [value]);

            const display = useMemo(() => {
                const fixed = value.toFixed(3);
                const [whole, decimal] = fixed.split('.');
                let formattedWhole = whole;
                let separator = region === 'EU' ? ',' : '.';
                if (region === 'CH') formattedWhole = whole.replace(/\B(?=(\d{3})+(?!\d))/g, "'");
                else if (region === 'EU') formattedWhole = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                else formattedWhole = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                return { whole: formattedWhole, sep: separator, decimal };
            }, [value, region]);

            return (
                <div className="min-h-screen p-3 md:p-8 no-select">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-6">
                            <h1 className="text-3xl font-extrabold text-indigo-600 mb-1 tracking-tight italic">Dezimal-Mathe</h1>
                            <p className="text-sm text-slate-500">Für schlaue Köpfe am Tablet & Handy</p>
                        </header>

                        {/* Region Selector - Compact for mobile */}
                        <div className="flex justify-center gap-2 mb-6">
                            {['CH', 'US', 'EU'].map(r => (
                                <button key={r} onClick={() => setRegion(r)} className={`px-3 py-1.5 rounded-full text-[10px] font-bold transition-all ${region === r ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-slate-500 border border-slate-200'}`}>
                                    {r === 'CH' ? '🇨🇭' : r === 'US' ? '🇺🇸' : '🇪🇺'} {r}
                                </button>
                            ))}
                        </div>

                        {/* Main Number Display */}
                        <section className="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-slate-200">
                            <div className="flex flex-col items-center gap-8">
                                <div className="text-6xl sm:text-8xl font-black tracking-tighter tabular-nums flex items-baseline justify-center">
                                    <span>{display.whole}</span>
                                    <span className="text-indigo-500 mx-1">{display.sep}</span>
                                    <span className="text-indigo-400">{display.decimal}</span>
                                </div>
                                <div className="w-full px-2">
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="2.999" 
                                        step="0.001" 
                                        value={value} 
                                        onChange={(e) => setValue(parseFloat(e.target.value))} 
                                    />
                                    <div className="flex justify-between mt-4 text-slate-400 font-black text-[10px] uppercase tracking-widest px-1">
                                        <span>0.000</span>
                                        <span>3.000</span>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Mobile Tabs - Full width row */}
                        <div className="flex gap-2 mb-6">
                            <TabButton active={activeTab === 'visualizer'} onClick={() => setActiveTab('visualizer')} icon={<Box />} label="Ansicht" />
                            <TabButton active={activeTab === 'placeValue'} onClick={() => setActiveTab('placeValue')} icon={<Grid3X3 />} label="Tabelle" />
                            <TabButton active={activeTab === 'fraction'} onClick={() => setActiveTab('fraction')} icon={<Scale />} label="Bruch" />
                        </div>

                        <main className="bg-white rounded-3xl shadow-xl p-5 sm:p-10 border border-slate-200 min-h-[400px]">
                            {activeTab === 'visualizer' && (
                                <div className="space-y-8">
                                    <div className="flex justify-center flex-wrap gap-6 py-4">
                                        {[0, 1, 2].map((slotIndex) => {
                                            const isFullyFilled = parts.whole > slotIndex;
                                            const isCurrentlyFilling = parts.whole === slotIndex;
                                            
                                            return (
                                                <div key={slotIndex} className="flex flex-col items-center gap-2">
                                                    <div className="whole-frame shadow-sm scale-90 sm:scale-100">
                                                        {isFullyFilled ? (
                                                            <div className="block-unit block-pop w-full h-full">1</div>
                                                        ) : isCurrentlyFilling ? (
                                                            <div className="flex w-full h-full items-end">
                                                                {Array.from({ length: parts.tenths }).map((_, i) => (
                                                                    <div key={`t-${i}`} className="block-tenth" />
                                                                ))}
                                                                {(parts.hundredths > 0 || parts.thousandths > 0) && parts.tenths < 10 && (
                                                                    <div className="flex flex-col-reverse w-[16px] h-full items-start bg-slate-50">
                                                                        {Array.from({ length: parts.hundredths }).map((_, i) => (
                                                                            <div key={`h-${i}`} className="block-hundredth" />
                                                                        ))}
                                                                        {parts.thousandths > 0 && parts.hundredths < 10 && (
                                                                            <div className="flex flex-col-reverse w-[16px] h-[16px] bg-emerald-50 items-start">
                                                                                {Array.from({ length: parts.thousandths }).map((_, i) => (
                                                                                    <div key={`th-${i}`} className="block-thousandth" />
                                                                                ))}
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ) : (
                                                            <div className="w-full h-full flex items-center justify-center opacity-5">
                                                                <div className="w-10 h-10 border-4 border-slate-400 rounded-full" />
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="bg-blue-50 border-l-4 border-blue-400 p-4 rounded-xl">
                                        <p className="text-blue-900 font-bold text-sm mb-1">💡 Mobile-Tipp:</p>
                                        <p className="text-blue-800 text-xs leading-relaxed">
                                            Schiebe den Regler oben auf <span className="font-bold underline">0,500</span>. Die blauen Balken füllen genau die Hälfte des Quadrats!
                                        </p>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'placeValue' && (
                                <div className="py-4 overflow-x-auto">
                                    <div className="min-w-[320px] grid grid-cols-5 gap-0 text-center rounded-2xl border-4 border-slate-100 overflow-hidden shadow-md">
                                        {['E', ',', '1/10', '1/100', '1/1000'].map((label, i) => (
                                            <div key={label} className={`p-3 text-[10px] font-black ${i === 1 ? 'bg-indigo-100 text-indigo-600' : 'bg-slate-100 text-slate-500'}`}>{label}</div>
                                        ))}
                                        <div className="bg-white p-4 sm:p-8 text-3xl sm:text-6xl font-black">{parts.whole}</div>
                                        <div className="bg-indigo-50 p-4 sm:p-8 text-3xl sm:text-6xl font-black text-indigo-500">{display.sep}</div>
                                        <div className="bg-white p-4 sm:p-8 text-3xl sm:text-6xl font-black text-blue-500">{parts.tenths}</div>
                                        <div className="bg-white p-4 sm:p-8 text-3xl sm:text-6xl font-black text-emerald-500">{parts.hundredths}</div>
                                        <div className="bg-white p-4 sm:p-8 text-3xl sm:text-6xl font-black text-amber-500">{parts.thousandths}</div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'fraction' && (
                                <div className="text-center py-10 space-y-10">
                                    <div className="flex flex-col items-center justify-center gap-8">
                                        <div className="bg-indigo-50 p-6 rounded-2xl w-full max-w-[200px] border border-indigo-100 shadow-sm">
                                            <p className="text-[10px] font-black text-indigo-300 mb-2 tracking-widest uppercase">Zahl</p>
                                            <div className="text-4xl font-black text-indigo-600">{display.whole}{display.sep}{display.decimal}</div>
                                        </div>
                                        <div className="text-xl font-bold text-slate-300 uppercase italic">ist das Gleiche wie...</div>
                                        <div className="bg-amber-50 p-6 rounded-2xl w-full max-w-[200px] border border-amber-100 shadow-sm">
                                            <p className="text-[10px] font-black text-amber-300 mb-2 tracking-widest uppercase">Bruch</p>
                                            <div className="flex flex-col items-center">
                                                <div className="text-4xl font-black border-b-4 border-slate-800 px-4 pb-1">{(value * 1000).toFixed(0)}</div>
                                                <div className="text-4xl font-black pt-1">1000</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
